name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  schedule:
    # Hourly: publishes scheduled posts when their time has passed. Skips the build when nothing is due.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# When Netlify or Cloudflare Pages hosts the site (repository variable GHDASH_HOST = netlify or cloudflare-pages),
# this workflow still publishes scheduled posts and runs plugin hooks and cron, but doesn't deploy to GitHub Pages.
env:
  DEPLOY_PAGES: ${{ vars.GHDASH_HOST == '' || vars.GHDASH_HOST == 'github-pages' }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
      hooks_base: ${{ steps.range.outputs.base || steps.publish.outputs.base }}
      hooks_head: ${{ steps.publish.outputs.head || steps.range.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: range
        if: github.event_name == 'push'
        run: |
          echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(npx ghdash-pages due)" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No scheduled content is due, skipping the build."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - id: pages
        if: steps.due.outputs.run == 'true' && env.DEPLOY_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Build (content/*.json -> SQLite -> static site)
        if: steps.due.outputs.run == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        # The build downloads font files from Google; retry so one network blip doesn't fail the deploy.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "build attempt $attempt failed, retrying"; sleep 10
          done
          exit 1
      - name: Commit scheduled posts that were just published
        id: publish
        if: steps.due.outputs.run == 'true'
        run: |
          if git diff --quiet -- content; then exit 0; fi
          before=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Publish scheduled content"
          if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "base=$before" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Could not push the published state; the next run will publish it again."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.run == 'true' && env.DEPLOY_PAGES == 'true'
        with:
          path: dist/client

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true' && (vars.GHDASH_HOST == '' || vars.GHDASH_HOST == 'github-pages')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  hooks:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && vars.GHDASH_HOST != '' && vars.GHDASH_HOST != 'github-pages')) && needs.build.outputs.hooks_head != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.hooks_head }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run plugin after-hooks for content that changed since the last run
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          [ -f hooks.config.json ] || { echo "No hooks.config.json, nothing to run."; exit 0; }
          git fetch --force origin "refs/tags/hooks-last:refs/tags/hooks-last" 2>/dev/null || true
          base=$(git rev-parse -q --verify hooks-last || echo "${{ needs.build.outputs.hooks_base }}")
          npx ghdash-pages run-hooks --base "$base" --head HEAD
          git tag -f hooks-last HEAD
          git push --force origin refs/tags/hooks-last

  cron:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run plugin cron jobs that fell due since the last run
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          grep -q '"cron"' hooks.config.json 2>/dev/null || { echo "No cron jobs in hooks.config.json, nothing to run."; exit 0; }
          git fetch --force origin "refs/tags/cron-last:refs/tags/cron-last" 2>/dev/null || true
          since=$(git for-each-ref refs/tags/cron-last --format='%(creatordate:iso-strict)')
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx ghdash-pages run-cron ${since:+--since "$since"} --now "$now"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a cron-last -m "$now" HEAD
          git push --force origin refs/tags/cron-last
